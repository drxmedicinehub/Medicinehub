<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Info App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f4f8;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #007bff;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .search-box {
            display: flex;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px 0 0 8px;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #007bff;
        }
        button {
            padding: 12px 20px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .med-card {
            background: #fdfdfd;
            border-left: 5px solid #28a745;
            padding: 15px;
            margin-top: 15px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .med-name {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
        .med-type {
            display: inline-block;
            background: #e2e8f0;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 5px;
        }
        .med-details {
            margin-top: 10px;
            font-size: 14px;
            line-height: 1.5;
        }
        .warning {
            color: #dc3545;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💊 Medicine Guide App</h1>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Dawa ka naam likhein (e.g., Paracetamol, Azithromycin)...">
        <button onclick="searchMedicine()">Search</button>
    </div>

    <div id="resultContainer">
        <p style="text-align: center; color: #777;">Kisi dawa ka naam search karein...</p>
    </div>
</div>

<script>
    const medicineDatabase = [
        {
            name: "Paracetamol (Crocin / Calpol)",
            type: "Tablet / Syrup / Injection",
            use: "Bukhar (Fever) ko kam karne aur badan dard, sir dard se rahat ke liye kiya jata hai.",
            dose: "Adults ke liye 500mg-650mg zaroorat ke mutabik. Bachhon ke liye weight ke hisab se Syrup.",
            warning: "Overdose se liver ko nuksan ho sakta hai. 24 ghante me 4 se zyada tablet na lein."
        },
        {
            name: "Amoxicillin aur Potassium Clavulanate (Augmentin 625)",
            type: "Tablet / Syrup",
            use: "Yeh ek heavy antibiotic hai jo kaan, naak, gale, fefdo (pneumonia) aur skin ke bade bacterial infections ko theek karta hai.",
            dose: "Doctor ki salah ke anusar aamtaur par din me 2 baar khane ke baad.",
            warning: "Isse pet kharab (diarrhea) ho sakta hai. Bina doctor ke poore course ke ise beech me na chhodein."
        },
        {
            name: "Pantoprazole Gastro-resistant (Pan-40 / Pantocid)",
            type: "Tablet / Injection",
            use: "Pet me acidity, gas, jalan (heartburn) aur peptic ulcer ke ilaj ke liye.",
            dose: "Aamtaur par subah khali pet ek tablet.",
            warning: "Lagne par hi lein, lambe samay tak bina doctor ki salah ke na khayein."
        },
        {
            name: "Cough Syrup (Ascoril / Benadryl / Grilinctus)",
            type: "Syrup",
            use: "Khansi (Cough), balgam aur gale ki kharash ko theek karne ke liye.",
            dose: "Adults ke liye 5-10 ml din me do se teen baar.",
            warning: "Kuch syrup se neend aa sakti hai, isliye ise peekar driving na karein."
        },
        {
            name: "Ceftriaxone Sodium (Monocef Injection)",
            type: "Injection (IV/IM)",
            use: "Severe bacterial infections, typhoid bukhar, aur operation ke baad bade infections se bachne ke liye.",
            dose: "Sirf hospital ya clinic me doctor/nurse dwara lagaya jata hai.",
            warning: "Isko ghar par khud se lagane ki koshish bilkul na karein. Skin allergy test zaroori hai."
        },
        {
            name: "Cetirizine Hydrochloride (Alerid / Okacet)",
            type: "Tablet / Syrup",
            use: "Sardi-jukham, naak behna, aankh se pani aana aur skin allergy/khujli ko theek karne ke liye.",
            dose: "Adults ke liye 10mg ki ek tablet raat ko sote samay.",
            warning: "Ise khane ke baad neend ya susti aa sakti hai, isliye ise lekar koi bhaari kaam ya driving na karein."
        },
        {
            name: "Metformin Hydrochloride (Glycomet)",
            type: "Tablet",
            use: "Type 2 Diabetes (Sugar) ke mareezon me blood sugar level ko control karne ke liye.",
            dose: "Doctor ki salah ke anusar, aamtaur par khane ke baad.",
            warning: "Bina doctor ke kahe is dawa ko achanak band na karein. Isse sugar achanak badh sakti hai."
        },
        {
            name: "Amlodipine Besylate (Amlong / Stamlo)",
            type: "Tablet",
            use: "High Blood Pressure (Uchch raktachaap) ko kam karne aur dil ki bimariyon se bachane ke liye.",
            dose: "Din me ek baar, doctor ke bataye gaye sahi power (2.5mg / 5mg) ke hisab se.",
            warning: "Is dawa se kuch logon ke pairon me halki sujan aa sakti hai. Regular BP check karate rahein."
        },
        {
            name: "Azithromycin Dihydrate (Azithral 500)",
            type: "Tablet / Syrup",
            use: "Gale ka infection (Tonsils), typhoid, aur daston ke infection me use hone wali antibiotic.",
            dose: "Aamtaur par din me 1 tablet, lagatar 3 se 5 din tak.",
            warning: "Ise khane se pet me halke dard ya ulti jaisa lag sakta hai."
        },
        {
            name: "Diclofenac Sodium aur Paracetamol (Voveran Plus / Reactin)",
            type: "Tablet / Gel / Injection",
            use: "Ghutno ka dard, gathiya (Arthritis), pathri ka dard ya kisi bhi bade sharirik dard ko turant rokne ke liye.",
            dose: "Dard hone par khane ke baad ek tablet.",
            warning: "Khali pet bilkul na lein, isse kidney aur pet par bura asar padta hai."
        },
        {
            name: "Atorvastatin Calcium (Lipitor / Tonact)",
            type: "Tablet",
            use: "Khoon me badhe hue kharab Cholesterol ko kam karne aur Heart Attack ke khatre ko rokne ke liye.",
            dose: "Aamtaur par raat ko sote samay ek tablet doctor ke kahe mutabik.",
            warning: "Agar is dawa ko khane ke baad maaspeshiyon (muscles) me tez dard ho, toh doctor ko untunt batayein."
        },
        {
            name: "Omeprazole aur Domperidone (Omez-D)",
            type: "Capsule",
            use: "Gale me jalan, khatti dakar aana aur gas ke sath ulti ya jichalaane (nausea) ko rokne ke liye.",
            dose: "Subah khane ke 30 minute pehle khali pet.",
            warning: "Bina doctor ki salah ke lagatar mahino tak ise na khayein."
        },
        {
            name: "Tramadol Hydrochloride (Ultram)",
            type: "Tablet / Capsule / Injection",
            use: "Operation ke baad ya accident ke baad hone wale asahniya aur bahut tez dard (Severe Pain) ko theek karne ke liye.",
            dose: "Sirf aur sirf doctor ke parche (prescription) par hi milti aur li jaati hai.",
            warning: "Yeh ek nasha paida karne wali dawa ho sakti hai, isliye iska aadat se bachna zaroori hai."
        },
        {
            name: "Ranitidine (Aciloc 150 / Rantac)",
            type: "Tablet / Injection",
            use: "Pet me normal gas, jalan aur acidity ko jald theek karne ki sasti aur asardar dawa.",
            dose: "Din me do baar khane se pehle ya baad me zaroorat ke hisab se.",
            warning: "Agar koi gambhir bimari hai toh doctor se pooch kar hi lein."
        },
        {
            name: "Ofloxacin aur Ornidazole (O2 Tablet)",
            type: "Tablet / Syrup",
            use: "Pet kharab hone par, loose motions (pechish) aur pet ke infection ko theek karne ke liye.",
            dose: "Adults ke liye subah-shaam ek-ek tablet khane ke baad (3 din tak).",
            warning: "Is dawa ko lene ke baad paani khoob peena chahiye."
        },
        {
            name: "Ibuprofen (Brufen 400)",
            type: "Tablet / Syrup",
            use: "Daant ka dard, maaspeshiyon ka khinchav, aur bleeding ke bina hone wale dardo me faydemand.",
            dose: "Khane ke baad ek tablet zaroorat padne par.",
            warning: "Asthma (dama) ke mareezon ko ise lene se pehle doctor se poochna chahiye."
        },
        {
            name: "Levocetirizine aur Montelukast (Montair-LC)",
            type: "Tablet / Syrup",
            use: "Purani khansi, dhool-mitti se hone wali allergy, asthma ki halki shikayat aur naak ke andar sujan ko rokne ke liye.",
            dose: "Raat ko sote samay sirf ek tablet.",
            warning: "Isse bhi halki susti aati hai, din me lene se bachein."
        },
        {
            name: "ORS - Oral Rehydration Salts (Electral)",
            type: "Powder / Liquid",
            use: "Body me paani ki kami (Dehydration), dastar (diarrhea) ya garmi me chakkar aane par body me namak aur paani balance karne ke liye.",
            dose: "1 packet powder ko 1 litre saaf paani me gholkar dinbhar thoda-thoda peena hai.",
            warning: "Ghol banane ke baad use 24 ghante ke andar hi khatam karein, baasi ghol na peein."
        }
    ];

    function searchMedicine() {
        const query = document.getElementById("searchInput").value.toLowerCase().trim();
        const resultContainer = document.getElementById("resultContainer");
        
        if (query === "") {
            resultContainer.innerHTML = "<p style='text-align: center; color: #dc3545;'>Kripya kuch type karein!</p>";
            return;
        }

        const results = medicineDatabase.filter(med => med.name.toLowerCase().includes(query));

        if (results.length > 0) {
            resultContainer.innerHTML = ""; 
            results.forEach(med => {
                const medHTML = `
                    <div class="med-card">
                        <div class="med-name">${med.name}</div>
                        <span class="med-type">${med.type}</span>
                        <div class="med-details">
                            <p><strong>Upyog (Use):</strong> ${med.use}</p>
                            <p><strong>Dose:</strong> ${med.dose}</p>
                            <p class="warning"><strong>Savadhani:</strong> ${med.warning}</p>
                        </div>
                    </div>
                `;
                resultContainer.innerHTML += medHTML;
            });
        } else {
            resultContainer.innerHTML = "<p style='text-align: center; color: #777;'>Maaf kijiye, is dawa ki jankari abhi database me nahi hai.</p>";
        }
    }
</script>

</body>
</html>
