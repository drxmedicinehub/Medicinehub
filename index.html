<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Info App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f4f8;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #007bff;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .search-box {
            display: flex;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px 0 0 8px;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #007bff;
        }
        button {
            padding: 12px 20px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .category-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .cat-btn {
            background-color: #e2e8f0;
            color: #4a5568;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .cat-btn:hover, .cat-btn.active {
            background-color: #007bff;
            color: white;
        }
        .med-card {
            background: #fdfdfd;
            border-left: 5px solid #28a745;
            padding: 15px;
            margin-top: 15px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .med-name {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
        .med-meta {
            margin-top: 5px;
        }
        .med-type {
            display: inline-block;
            background: #e2e8f0;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .med-cat-tag {
            display: inline-block;
            background: #e1f5fe;
            color: #0288d1;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 5px;
        }
        .med-details {
            margin-top: 10px;
            font-size: 14px;
            line-height: 1.5;
        }
        .warning {
            color: #dc3545;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💊 Master Medicine Guide</h1>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Dawa ya Category ka naam likhein (e.g., Gas, Pain, Sugar)...">
        <button onclick="searchMedicine()">Search</button>
    </div>

    <div class="category-container">
        <button class="cat-btn" onclick="filterCategory('All')">All</button>
        <button class="cat-btn" onclick="filterCategory('Bukhar aur Dard')">Bukhar/Dard</button>
        <button class="cat-btn" onclick="filterCategory('Gas aur Acidity')">Gas/Acidity</button>
        <button class="cat-btn" onclick="filterCategory('Antibiotics')">Antibiotics</button>
        <button class="cat-btn" onclick="filterCategory('BP aur Heart')">BP & Heart</button>
        <button class="cat-btn" onclick="filterCategory('Sugar (Diabetes)')">Sugar</button>
        <button class="cat-btn" onclick="filterCategory('Khansi aur Allergy')">Khansi/Allergy</button>
        <button class="cat-btn" onclick="filterCategory('Vitamins aur Taqat')">Vitamins/Taqat</button>
        <button class="cat-btn" onclick="filterCategory('Pet ke Rog')">Pet Rog (Loose Motion)</button>
    </div>

    <div id="resultContainer">
        <p style="text-align: center; color: #777;">Upar kisi category par click karein ya dawa search karein...</p>
    </div>
</div>

<script>
    const medicineDatabase = [
        // === BUKHAR AUR DARD ===
        {
            name: "Paracetamol (Crocin / Calpol / Dolo 650)",
            category: "Bukhar aur Dard",
            type: "Tablet / Syrup",
            use: "Bukhar kam karne, sir dard, badan dard aur halka dard theek karne me.",
            dose: "Adults: 500mg - 650mg zaroorat par (Max 4 tablet in 24 hours).",
            warning: "Overdose se Liver damage ho sakta hai. Alcohol ke sath na lein."
        },
        {
            name: "Diclofenac Sodium (Voveran)",
            category: "Bukhar aur Dard",
            type: "Tablet / Gel / Injection",
            use: "Tez dard, gathiya (arthritis), pathri ka dard aur sujan kam karne me.",
            dose: "Khane ke baad ek tablet zaroorat padne par.",
            warning: "Khali pet bilkul na lein, isse pet me ulcer ya kidney par bura asar padta hai."
        },
        {
            name: "Ibuprofen (Brufen 400)",
            category: "Bukhar aur Dard",
            type: "Tablet",
            use: "Daant dard, maaspeshiyon ka khinchav, aur periods ke dard me.",
            dose: "Din me 2 se 3 baar khane ke baad.",
            warning: "Asthma ke mareez aur pregnant mahilayein bina doctor se pooche na lein."
        },
        {
            name: "Aceclofenac + Paracetamol (Zerodol-P)",
            category: "Bukhar aur Dard",
            type: "Tablet",
            use: "Peeth dard, gardan dard, aur body ke joints ke tez dard ko rokne me.",
            dose: "Subah-shaam ek-ek tablet khane ke baad.",
            warning: "Isse pet me jalan ya acidity ho sakti hai."
        },
        {
            name: "Mefenamic Acid (Meftal Spas)",
            category: "Bukhar aur Dard",
            type: "Tablet",
            use: "Pet me hone wale mroad/dard aur periods (menstrual) ke dard me sabse asardar.",
            dose: "Dard hone par ek tablet khane ke baad.",
            warning: "Khali pet na lein, aur lagatar kai dino tak na khayein."
        },

        // === GAS AUR ACIDITY ===
        {
            name: "Pantoprazole (Pan-40 / Pantocid)",
            category: "Gas aur Acidity",
            type: "Tablet / Capsule",
            use: "Pet me tez acidity, gas, chhati me jalan aur peptic ulcer ke ilaj me.",
            dose: "Subah khali pet (khana khane se 30 min pehle) ek tablet.",
            warning: "Lambe samay tak bina wajah lene se haddiyan kamzor ho sakti hain."
        },
        {
            name: "Omeprazole + Domperidone (Omez-D)",
            category: "Gas aur Acidity",
            type: "Capsule",
            use: "Gas ke sath-sath ulti jaisa lagna (Nausea) ya khatti dakar aana rokta hai.",
            dose: "Subah khali pet ek capsule.",
            warning: "Doctor ki salah ke bina ise mahino tak lagatar na lein."
        },
        {
            name: "Ranitidine (Aciloc 150 / Rantac)",
            category: "Gas aur Acidity",
            type: "Tablet",
            use: "Normal gas, acidity aur pet ki jalan ko jald theek karne ki sasti dawa.",
            dose: "Din me do baar (subah-shaam) khane se pehle.",
            warning: "Kidney ke mareez doctor se pooch kar hi dose set karein."
        },
        {
            name: "Sukralfate + Oxetacaine (Sucrafil Suspension)",
            category: "Gas aur Acidity",
            type: "Syrup",
            use: "Pet ke ulcer (chaale) aur food pipe ki tez jalan ko turant thanda karne me.",
            dose: "2 chammach khana khane ke 1 ghante pehle ya sote samay.",
            warning: "Ise lene ke turant baad kuch khayein-piyein nahi."
        },

        // === ANTIBIOTICS ===
        {
            name: "Amoxicillin + Clavulanate (Augmentin 625)",
            category: "Antibiotics",
            type: "Tablet",
            use: "Heavy antibiotic. Kaan, naak, gale, pneumonia aur skin ke bade bacterial infection me.",
            dose: "Din me 2 baar khane ke baad (Course poora karna zaroori hai).",
            warning: "Isse loose motion (dast) ho sakta hai. Bina infection ke na lein."
        },
        {
            name: "Azithromycin (Azithral 500)",
            category: "Antibiotics",
            type: "Tablet",
            use: "Gale ki kharash, tonsils, typhoid bukhar aur sardi-khansi ke infection me.",
            dose: "Din me 1 tablet, lagatar 3 se 5 din tak khane ke baad.",
            warning: "Heart ke mareezon ko bina doctor ki advice ke nahi dena chahiye."
        },
        {
            name: "Cefixime (Taxim-O 200)",
            category: "Antibiotics",
            type: "Tablet / Syrup",
            use: "Typhoid bukhar, urine infection (UTI) aur kaan ke infection me.",
            dose: "Subah-shaam ek-ek tablet khane ke baad.",
            warning: "Bina doctor ke kahe course ko beech me achanak na chhodein."
        },
        {
            name: "Ciprofloxacin (Cifran 500)",
            category: "Antibiotics",
            type: "Tablet",
            use: "Skin infection, joints ka infection aur pet ke severe infections me.",
            dose: "Din me do baar khane ke baad doctor ke anusar.",
            warning: "Is dawa se chakkar aa sakte hain, isliye dhoop me nikalne se bachein."
        },

        // === BLOOD PRESSURE AUR HEART ===
        {
            name: "Amlodipine (Amlong / Stamlo 5)",
            category: "BP aur Heart",
            type: "Tablet",
            use: "High Blood Pressure (Uchch raktachaap) ko control karne me.",
            dose: "Din me ek baar fixed time par (Doctor ke bataye dose ke hisab se).",
            warning: "Isse kuch logon ke takhno (ankles) me sujan aa sakti hai."
        },
        {
            name: "Telmisartan (Telma 40)",
            category: "BP aur Heart",
            type: "Tablet",
            use: "High BP ko kam karta hai aur Heart attack aur Kidney damage se bachata hai.",
            dose: "Din me ek baar khana khane ke baad ya pehle.",
            warning: "Pregnancy me yeh dawa bilkul banned (mana) hai."
        },
        {
            name: "Atorvastatin (Lipitor / Tonact)",
            category: "BP aur Heart",
            type: "Tablet",
            use: "Khoon me badhe hue kharab Cholesterol ko kam karne aur heart stroke rokne me.",
            dose: "Raat ko sote samay 1 tablet.",
            warning: "Agar maaspeshiyon me tez dard ho, toh doctor ko turant batayein."
        },
        {
            name: "Aspirin (Ecosprin 75)",
            category: "BP aur Heart",
            type: "Tablet",
            use: "Blood Thinner (Khoon patla karne wali). Heart attack ke khatre ko rokne me.",
            dose: "Din me ek baar khane ke baad.",
            warning: "Isse bleeding ka khatra badhta hai, isliye chot lagne par dhyan dein."
        },

        // === SUGAR (DIABETES) ===
        {
            name: "Metformin (Glycomet 500)",
            category: "Sugar (Diabetes)",
            type: "Tablet",
            use: "Type 2 Diabetes ke mareezon me blood sugar level control karne me.",
            dose: "Doctor ke kahe anusar, aamtaur par khane ke sath ya turant baad.",
            warning: "Is dawa ko lene ke baad lamba upwas (vrat) na rakhein, sugar bohot kam ho sakti hai."
        },
        {
            name: "Glimepiride (Amaryl)",
            category: "Sugar (Diabetes)",
            type: "Tablet",
            use: "Pancreas se insulin badhakar blood sugar level ko turant kam karta hai.",
            dose: "Subah ke pehle khane (breakfast) ke turant pehle ya sath me.",
            warning: "Agar chakkar aaye ya paseena aaye, toh turant kuch meetha kha lein (Hypoglycemia)."
        },

        // === KHANSI AUR ALLERGY ===
        {
            name: "Cetirizine (Alerid / Okacet)",
            category: "Khansi aur Allergy",
            type: "Tablet",
            use: "Sardi-jukham, naak behna, aankhon se pani aana aur skin ki khujli me.",
            dose: "Raat ko sote samay 1 tablet.",
            warning: "Ise khane ke baad neend aati hai, isliye driving ya bhaari machine na chalayein."
        },
        {
            name: "Levocetirizine + Montelukast (Montair-LC)",
            category: "Khansi aur Allergy",
            type: "Tablet",
            use: "Purani sardi, naak ki sujan, dhool se allergy aur khansi-asthma ke symptoms me.",
            dose: "Raat ko khana khane ke baad ek tablet.",
            warning: "Susti aur neend aana iska mukhya side effect hai."
        },
        {
            name: "Ascoril LS / Benadryl",
            category: "Khansi aur Allergy",
            type: "Syrup",
            use: "Balgam wali khansi (Wet Cough) aur gale ki kharash ko saaf karne me.",
            dose: "Adults: 5-10 ml din me do se do se teen baar.",
            warning: "Heart aur high BP ke mareez doctor se pooch kar hi lein."
        },

        // === VITAMINS AUR TAQAT ===
        {
            name: "Multivitamins + Minerals (Zincovit / Revital H)",
            category: "Vitamins aur Taqat",
            type: "Tablet / Capsule",
            use: "Sharirik kamzori dur karne, immunity badhane aur bimari ke baad taqat ke liye.",
            dose: "Din me ek baar, aamtaur par dopahar ya raat ke khane ke baad.",
            warning: "Ise lene par peshab (urine) ka rang peela ho sakta hai, jo ki normal hai."
        },
        {
            name: "Vitamin D3 Cholecalciferol (Calcirol Sachet)",
            category: "Vitamins aur Taqat",
            type: "Granules / Sachet",
            use: "Haddiyon aur daanton ko mazboot karne aur Vitamin D ki kami poora karne me.",
            dose: "Hafte me sirf ek baar (Once a week) doodh me gholkar.",
            warning: "Doctor ke bataye hafton tak hi lein, rozana na khayein."
        },
        {
            name: "Calcium + Vitamin D3 (Shelcal 500)",
            category: "Vitamins aur Taqat",
            type: "Tablet",
            use: "Haddiyon ke dard, jodon ke dard aur calcium ki kami ko door karne me.",
            dose: "Din me ek tablet khane ke baad (Doodh ya pani ke sath).",
            warning: "Pathri (Kidney stone) ke mareez ise bina doctor ki salah ke na lein."
        },
        {
            name: "Neurobion Forte",
            category: "Vitamins aur Taqat",
            type: "Tablet",
            use: "Vitamin B-Complex ki dawa. Naso me dard, jhanjhanahat aur sujan ko theek karne me.",
            dose: "Din me ek tablet rozana khane ke baad.",
            warning: "Bina zarurat ke lambe samay tak na lein."
        },

        // === PET KE ROG ===
        {
            name: "Ofloxacin + Ornidazole (O2 Tablet)",
            category: "Pet ke Rog",
            type: "Tablet",
            use: "Pet kharab hone, loose motion (dast) aur pechish (amoebiasis) ko rokne me.",
            dose: "Subah-shaam ek-ek tablet khane ke baad (3 din tak).",
            warning: "Is dawa ke sath paani khoob peena chahiye taaki dehydration na ho."
        },
        {
            name: "Loperamide (Roko)",
            category: "Pet ke Rog",
            type: "Tablet",
            use: "Achanak hone wale tez dast (diarrhea) ko turant rokne ke liye.",
            dose: "Pehle 2 tablet ek sath, fir har dast ke baad 1 tablet (Max 4 in a day).",
            warning: "Agar dast me khoon aa raha ho ya bukhar ho, toh ise bilkul na lein."
        },
        {
            name: "ORS - Oral Rehydration Salts (Electral)",
            category: "Pet ke Rog",
            type: "Powder",
            use: "Dast ya ulti me sharir se pani aur namak ki kami (dehydration) ko door karne me.",
            dose: "1 packet ko 1 litre saaf pani me gholkar dinbhar thoda-thoda peein.",
            warning: "Ghol banane ke 24 ghante baad bacha hua paani phek dein, baasi na peein."
        }
    ];

    // Function to search/filter from input box
    function searchMedicine() {
        const query = document.getElementById("searchInput").value.toLowerCase().trim();
        const resultContainer = document.getElementById("resultContainer");
        
        // Remove active class from category buttons during search
        const buttons = document.querySelectorAll('.cat-btn');
        buttons.forEach(b => b.classList.remove('active'));

        if (query === "") {
            resultContainer.innerHTML = "<p style='text-align: center; color: #dc3545;'>Kripya kuch type karein!</p>";
            return;
        }

        const results = medicineDatabase.filter(med => 
            med.name.toLowerCase().includes(query) || 
            med.category.toLowerCase().includes(query) ||
            med.use.toLowerCase().includes(query)
        );

        displayResults(results);
    }

    // Function to filter by clicking Category buttons
    function filterCategory(catName) {
        const resultContainer = document.getElementById("resultContainer");
        
        // Handle Active Button styling
        const buttons = document.querySelectorAll('.cat-btn');
        buttons.forEach(b => {
            if(b.innerText.includes(catName) || (catName === 'All' && b.innerText === 'All')) {
                b.classList.add('active');
            } else {
                b.classList.remove('active');
            }
        });

        if (catName === 'All') {
            displayResults(medicineDatabase);
            return;
        }

        const results = medicineDatabase.filter(med => med.category === catName);
        displayResults(results);
    }

    // Common function to display items
    function displayResults(results) {
        const resultContainer = document.getElementById("resultContainer");
        
        if (results.length > 0) {
            resultContainer.innerHTML = ""; 
            results.forEach(med => {
                const medHTML = `
                    <div class="med-card">
                        <div class="med-name">${med.name}</div>
                        <div class="med-meta">
                            <span class="med-type">${med.type}</span>
                            <span class="med-cat-tag">${med.category}</span>
                        </div>
                        <div class="med-details">
                            <p><strong>Upyog (Use):</strong> ${med.use}</p>
                            <p><strong>Dose:</strong> ${med.dose}</p>
                            <p class="warning"><strong>Savadhani:</strong> ${med.warning}</p>
                        </div>
                    </div>
                `;
                resultContainer.innerHTML += medHTML;
            });
        } else {
            resultContainer.innerHTML = "<p style='text-align: center; color: #777;'>Maaf kijiye, is dawa ya category ki jankari abhi nahi hai.</p>";
        }
    }
</script>

</body>
</html>
